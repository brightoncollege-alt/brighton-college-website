    <!-- Theme before first paint: no white flash in dark mode.
         Reads saved choice, else prefers-color-scheme. -->
    <script>
    (function(){try{var t=localStorage.getItem('bcp_theme');
      if(t!=='dark'&&t!=='light'){t=(window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches)?'dark':'light';}
      document.documentElement.dataset.theme=t;}catch(e){}})();
    </script>
    <!-- PWA install: catch beforeinstallprompt EARLY, in <head>.
         On slow phones the JS bundle (and the React install button)
         loads seconds after the page, and Chrome can fire
         beforeinstallprompt BEFORE the button's listener exists — the
         event is then lost and the button can only show help text.
         This tiny script holds the event on window until the button
         reads it. -->
    <script>
    (function(){try{
      window.__deferredPrompt = null;
      window.addEventListener('beforeinstallprompt', function(e){
        e.preventDefault();
        window.__deferredPrompt = e;
      });
      window.addEventListener('appinstalled', function(){
        window.__deferredPrompt = null;
      });
    }catch(e){}})();
    </script>
